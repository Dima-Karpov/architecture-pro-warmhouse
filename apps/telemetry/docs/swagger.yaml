components:
  schemas:
    healthcheck.Response:
      properties:
        status:
          type: string
      type: object
    responses.ErrorContext:
      properties:
        id:
          example: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f
          format: uuid
          type: string
      type: object
    responses.IngestRequest:
      properties:
        device_id:
          example: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f
          type: string
        house_id:
          example: 01932c4e-8a1d-7222-8333-3c6d7e8f9012
          type: string
        recorded_at:
          example: "2026-09-05T10:00:00Z"
          format: date-time
          type: string
        unit:
          example: °C
          type: string
        value:
          example: 21.4
          type: number
      type: object
    responses.InternalErrorResponse:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/responses.InternalServerError'
          type: array
          uniqueItems: false
      type: object
    responses.InternalServerError:
      properties:
        message:
          example: Something went wrong
          type: string
        type:
          enum:
          - InternalServerError
          example: InternalServerError
          type: string
      type: object
    responses.NotFoundError:
      properties:
        context:
          $ref: '#/components/schemas/responses.ErrorContext'
        message:
          example: Device not found
          type: string
        type:
          enum:
          - NotFoundError
          example: NotFoundError
          type: string
      type: object
    responses.NotFoundResponse:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/responses.NotFoundError'
          type: array
          uniqueItems: false
      type: object
    responses.ReadingResponse:
      properties:
        device_id:
          example: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f
          type: string
        id:
          example: 01932c4e-8a1f-7444-8555-5e8f90123456
          type: string
        recorded_at:
          example: "2026-09-05T10:00:00Z"
          format: date-time
          type: string
        unit:
          example: °C
          type: string
        value:
          example: 21.4
          type: number
      type: object
externalDocs:
  description: ""
  url: ""
info:
  description: Показания устройств. Монолит отдаёт опрос температуры на переход.
  title: telemetry
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/telemetry:
    get:
      parameters:
      - description: ID устройств через запятую
        example: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f
        in: query
        name: device_ids
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/responses.ReadingResponse'
                type: array
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.NotFoundResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.InternalErrorResponse'
          description: Internal Server Error
      summary: Получить показания устройств
      tags:
      - telemetry
    post:
      description: Монолит отдаёт опрос temperature-api на переход.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/responses.IngestRequest'
                description: Показание
                summary: request
        description: Показание
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ReadingResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.InternalErrorResponse'
          description: Internal Server Error
      summary: Записать показание
      tags:
      - telemetry
  /health:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/healthcheck.Response'
          description: OK
      summary: Health check
      tags:
      - health
servers:
- description: local
  url: http://localhost:8083
