services:
  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smarthome}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - smarthome-network

  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    container_name: temperature-api
    environment:
      - PORT=8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - smarthome-network

  device:
    build:
      context: ./device
      dockerfile: Dockerfile
    container_name: device
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=8082
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/device
      - DEFAULT_HOUSE_ID=${DEVICE_DEFAULT_HOUSE_ID:-01932c4e-8a1d-7222-8333-3c6d7e8f9012}
      - DEFAULT_TYPE_ID=${DEVICE_DEFAULT_TYPE_ID:-01932c4e-8a1c-7111-8222-2b5c6d7e8f90}
    ports:
      - "${DEVICE_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - smarthome-network

  broker:
    image: rabbitmq:3.13-management-alpine
    container_name: broker
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - smarthome-network

  telemetry:
    build:
      context: ./telemetry
      dockerfile: Dockerfile
    container_name: telemetry
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      - PORT=8083
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/telemetry
      - AMQP_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@broker:5672/
      - DEFAULT_HOUSE_ID=${DEVICE_DEFAULT_HOUSE_ID:-01932c4e-8a1d-7222-8333-3c6d7e8f9012}
    ports:
      - "${TELEMETRY_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - smarthome-network

  scenario:
    build:
      context: ./scenario
      dockerfile: Dockerfile
    container_name: scenario
    depends_on:
      broker:
        condition: service_healthy
    environment:
      - PORT=8084
      - AMQP_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@broker:5672/
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - smarthome-network

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      db:
        condition: service_healthy
      temperature-api:
        condition: service_healthy
      device:
        condition: service_healthy
      telemetry:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-smarthome}
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - DEVICE_API_URL=http://device:8082
      - TELEMETRY_API_URL=http://telemetry:8083
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  db_data:

networks:
  smarthome-network:
    driver: bridge
