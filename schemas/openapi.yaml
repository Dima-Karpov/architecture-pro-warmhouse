components:
  schemas:
    Command:
      properties:
        action:
          enum:
          - "on"
          - "off"
          - lock
          example: "on"
          type: string
        created_at:
          example: "2026-09-05T10:00:00Z"
          format: date-time
          type: string
        device_id:
          example: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f
          format: uuid
          type: string
        id:
          example: 01932c4e-8a1e-7333-8444-4d7e8f901234
          format: uuid
          type: string
        result:
          example: ok
          type: string
        source:
          enum:
          - user
          - scenario
          example: user
          type: string
      type: object
    ConflictResponse:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/DeviceInactiveError'
          type: array
          uniqueItems: false
      type: object
    Device:
      properties:
        address:
          example: 192.168.10.4:47808
          type: string
        house_id:
          example: 01932c4e-8a1d-7222-8333-3c6d7e8f9012
          format: uuid
          type: string
        id:
          example: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f
          format: uuid
          type: string
        serial_number:
          example: RL-22
          type: string
        status:
          enum:
          - "on"
          - "off"
          - inactive
          example: "on"
          type: string
        type_code:
          enum:
          - heating
          - light
          - gate
          - camera
          - unknown
          example: heating
          type: string
        type_id:
          example: 01932c4e-8a1c-7111-8222-2b5c6d7e8f90
          format: uuid
          type: string
      type: object
    DeviceInactiveError:
      properties:
        context:
          $ref: '#/components/schemas/ErrorContext'
        message:
          example: Device is inactive
          type: string
        type:
          enum:
          - DeviceInactiveError
          example: DeviceInactiveError
          type: string
      type: object
    DeviceStatusUpdate:
      properties:
        status:
          enum:
          - "on"
          - "off"
          example: "off"
          type: string
      required:
      - status
      type: object
    ErrorContext:
      properties:
        id:
          example: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f
          format: uuid
          type: string
      type: object
    InternalErrorResponse:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/InternalServerError'
          type: array
          uniqueItems: false
      type: object
    InternalServerError:
      properties:
        message:
          example: Something went wrong
          type: string
        type:
          enum:
          - InternalServerError
          example: InternalServerError
          type: string
      type: object
    NotFoundError:
      properties:
        context:
          $ref: '#/components/schemas/ErrorContext'
        message:
          example: Device not found
          type: string
        type:
          enum:
          - NotFoundError
          example: NotFoundError
          type: string
      type: object
    NotFoundResponse:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/NotFoundError'
          type: array
          uniqueItems: false
      type: object
    SendCommand:
      properties:
        action:
          enum:
          - "on"
          - "off"
          - lock
          example: "on"
          type: string
        device_id:
          example: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f
          format: uuid
          type: string
      required:
      - action
      - device_id
      type: object
    TelemetryData:
      properties:
        device_id:
          example: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f
          format: uuid
          type: string
        id:
          example: 01932c4e-8a1f-7444-8555-5e8f90123456
          format: uuid
          type: string
        recorded_at:
          example: "2026-09-05T10:00:00Z"
          format: date-time
          type: string
        unit:
          example: °C
          type: string
        value:
          example: 21.4
          type: number
      type: object
info:
  description: Синхронный HTTP JSON через API Gateway (ADR-006).
  title: Тёплый дом — REST API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/commands:
    post:
      description: Ручная команда или вызов сценария. source ставит сервис (токен
        жильца или scenario), не клиент. В брокер не идёт.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCommand'
            examples:
              command:
                value:
                  device_id: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f
                  action: "on"
        description: Команда
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
              examples:
                command:
                  value:
                    id: 01932c4e-8a1e-7333-8444-4d7e8f901234
                    device_id: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f
                    action: "on"
                    source: user
                    result: ok
                    created_at: "2026-09-05T10:00:00Z"
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
              examples:
                not_found:
                  value:
                    errors:
                      - type: NotFoundError
                        message: Device not found
                        context:
                          id: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
              examples:
                inactive:
                  value:
                    errors:
                      - type: DeviceInactiveError
                        message: Device is inactive
                        context:
                          id: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
              examples:
                internal:
                  value:
                    errors:
                      - type: InternalServerError
                        message: Something went wrong
          description: Internal Server Error
      summary: Отправить команду устройству
      tags:
      - command
  /api/v1/devices/{id}:
    get:
      description: Жилец смотрит прибор. command тем же методом берёт type_code и
        address.
      parameters:
      - description: Device ID
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                device:
                  value:
                    id: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f
                    type_id: 01932c4e-8a1c-7111-8222-2b5c6d7e8f90
                    house_id: 01932c4e-8a1d-7222-8333-3c6d7e8f9012
                    type_code: heating
                    serial_number: RL-22
                    address: "192.168.10.4:47808"
                    status: "on"
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
              examples:
                not_found:
                  value:
                    errors:
                      - type: NotFoundError
                        message: Device not found
                        context:
                          id: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
              examples:
                internal:
                  value:
                    errors:
                      - type: InternalServerError
                        message: Something went wrong
          description: Internal Server Error
      summary: Получить устройство
      tags:
      - device
  /api/v1/devices/{id}/status:
    patch:
      parameters:
      - description: Device ID
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceStatusUpdate'
            examples:
              status:
                value:
                  status: "off"
        description: Новый статус on/off
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              examples:
                device:
                  value:
                    id: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f
                    type_id: 01932c4e-8a1c-7111-8222-2b5c6d7e8f90
                    house_id: 01932c4e-8a1d-7222-8333-3c6d7e8f9012
                    type_code: heating
                    serial_number: RL-22
                    address: "192.168.10.4:47808"
                    status: "off"
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
              examples:
                not_found:
                  value:
                    errors:
                      - type: NotFoundError
                        message: Device not found
                        context:
                          id: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
              examples:
                internal:
                  value:
                    errors:
                      - type: InternalServerError
                        message: Something went wrong
          description: Internal Server Error
      summary: Обновить состояние устройства
      tags:
      - device
  /api/v1/telemetry:
    get:
      parameters:
      - description: ID устройств через запятую
        examples:
          ids:
            value: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f,01932c4e-8a1c-7111-8222-2b5c6d7e8f90
        in: query
        name: device_ids
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TelemetryData'
                type: array
              examples:
                readings:
                  value:
                    - id: 01932c4e-8a1f-7444-8555-5e8f90123456
                      device_id: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f
                      value: 21.4
                      unit: °C
                      recorded_at: "2026-09-05T10:00:00Z"
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
              examples:
                not_found:
                  value:
                    errors:
                      - type: NotFoundError
                        message: Device not found
                        context:
                          id: 01932c4e-8a1b-7f3c-8d2e-1a4b5c6d7e8f
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
              examples:
                internal:
                  value:
                    errors:
                      - type: InternalServerError
                        message: Something went wrong
          description: Internal Server Error
      summary: Получить показания устройств
      tags:
      - telemetry
servers:
- description: API Gateway
  url: https://api.warmhouse.example
